name: CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    if: github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/srv/chat-meme-scraper' }}
      BOT_IMAGE: ghcr.io/${{ github.repository_owner }}/dawgostan-monorepo-bot:${{ github.sha }}
      WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/dawgostan-monorepo-worker:${{ github.sha }}
      NSFW_ENSEMBLE_IMAGE: ghcr.io/${{ github.repository_owner }}/dawgostan-monorepo-nsfw-ensemble:${{ github.sha }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}
      PROD_ENV_B64: ${{ secrets.PROD_ENV_B64 }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
      GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
      GRAFANA_CLOUD_PROMETHEUS_URL: ${{ vars.GRAFANA_CLOUD_PROMETHEUS_URL }}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${{ vars.GRAFANA_CLOUD_PROMETHEUS_USER }}
      GRAFANA_CLOUD_LOKI_URL: ${{ vars.GRAFANA_CLOUD_LOKI_URL }}
      GRAFANA_CLOUD_LOKI_USER: ${{ vars.GRAFANA_CLOUD_LOKI_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          tags: |
            ${{ env.WORKER_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/dawgostan-monorepo-worker:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          push: true
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
          tags: |
            ${{ env.BOT_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/dawgostan-monorepo-bot:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/nsfw-ensemble/Dockerfile
          push: true
          cache-from: type=gha,scope=nsfw-ensemble
          cache-to: type=gha,mode=max,scope=nsfw-ensemble
          tags: |
            ${{ env.NSFW_ENSEMBLE_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/dawgostan-monorepo-nsfw-ensemble:latest

      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR
          script: |
            set -e
            mkdir -p "$APP_DIR"
            mkdir -p "$APP_DIR/private"
            mkdir -p "$APP_DIR/monitoring"
            chmod 700 "$APP_DIR/private"

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml,monitoring/config.alloy
          target: ${{ secrets.VPS_APP_DIR || '/srv/chat-meme-scraper' }}

      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR,PROD_ENV_B64,YOUTUBE_COOKIES_B64,BOT_IMAGE,WORKER_IMAGE,NSFW_ENSEMBLE_IMAGE,GHCR_USERNAME,GHCR_TOKEN,GRAFANA_CLOUD_TOKEN,GRAFANA_CLOUD_PROMETHEUS_URL,GRAFANA_CLOUD_PROMETHEUS_USER,GRAFANA_CLOUD_LOKI_URL,GRAFANA_CLOUD_LOKI_USER
          script: |
            set -eu
            cd "$APP_DIR"
            test -n "$GRAFANA_CLOUD_TOKEN"
            test -n "$GRAFANA_CLOUD_PROMETHEUS_URL"
            test -n "$GRAFANA_CLOUD_PROMETHEUS_USER"
            test -n "$GRAFANA_CLOUD_LOKI_URL"
            test -n "$GRAFANA_CLOUD_LOKI_USER"
            if [ -n "$YOUTUBE_COOKIES_B64" ]; then
              umask 077
              printf '%s' "$YOUTUBE_COOKIES_B64" | base64 -d > private/youtube-cookies.txt.tmp
              test -s private/youtube-cookies.txt.tmp
              mv private/youtube-cookies.txt.tmp private/youtube-cookies.txt
            fi
            umask 077
            printf '%s' "$GRAFANA_CLOUD_TOKEN" > private/grafana-cloud-token.tmp
            test -s private/grafana-cloud-token.tmp
            mv private/grafana-cloud-token.tmp private/grafana-cloud-token
            printf '%s' "$PROD_ENV_B64" | base64 -d > .env
            {
              printf 'BOT_IMAGE=%s\n' "$BOT_IMAGE"
              printf 'WORKER_IMAGE=%s\n' "$WORKER_IMAGE"
              printf 'NSFW_ENSEMBLE_IMAGE=%s\n' "$NSFW_ENSEMBLE_IMAGE"
              printf 'GRAFANA_CLOUD_PROMETHEUS_URL=%s\n' "$GRAFANA_CLOUD_PROMETHEUS_URL"
              printf 'GRAFANA_CLOUD_PROMETHEUS_USER=%s\n' "$GRAFANA_CLOUD_PROMETHEUS_USER"
              printf 'GRAFANA_CLOUD_LOKI_URL=%s\n' "$GRAFANA_CLOUD_LOKI_URL"
              printf 'GRAFANA_CLOUD_LOKI_USER=%s\n' "$GRAFANA_CLOUD_LOKI_USER"
            } >> .env
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker image prune -af
            docker compose -f docker-compose.prod.yml pull worker bot nsfw-ensemble alloy
            docker compose -f docker-compose.prod.yml up -d postgres
            docker compose -f docker-compose.prod.yml run --rm worker pnpm db:migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans nsfw-ensemble worker bot alloy
            docker compose -f docker-compose.prod.yml ps
