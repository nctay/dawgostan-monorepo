services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    restart: unless-stopped
    volumes:
      - ./private:/run/private
    env_file:
      - path: .env
        required: true
    environment:
      MAX_VIDEO_BYTES: "104857600"
      NSFW_ENSEMBLE_CLASSIFIER_URL: http://nsfw-ensemble:3333/classify
      NSFW_ENSEMBLE_THRESHOLD: "0.8"
      WTV_CHANNELS: "${WTV_CHANNELS:-},pixel_bot"
    depends_on:
      postgres:
        condition: service_healthy
      nsfw-ensemble:
        condition: service_healthy

  nsfw-ensemble:
    image: ${NSFW_ENSEMBLE_IMAGE:?NSFW_ENSEMBLE_IMAGE is required}
    restart: unless-stopped
    cpus: 2
    mem_limit: 2500m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3333/health', timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 6

  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE is required}
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    privileged: true
    cpus: 0.5
    mem_limit: 512m
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:?GRAFANA_CLOUD_PROMETHEUS_URL is required}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:?GRAFANA_CLOUD_PROMETHEUS_USER is required}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:?GRAFANA_CLOUD_LOKI_URL is required}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:?GRAFANA_CLOUD_LOKI_USER is required}
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - ./private/grafana-cloud-token:/run/secrets/grafana-cloud-token:ro
      - alloy-data:/var/lib/alloy/data
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

volumes:
  postgres-data:
  alloy-data:
