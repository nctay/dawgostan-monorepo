services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NSFW_ENSEMBLE_CLASSIFIER_URL: http://nsfw-ensemble:3333/classify
      NSFW_ENSEMBLE_THRESHOLD: "0.8"
    depends_on:
      postgres:
        condition: service_healthy
      nsfw-ensemble:
        condition: service_healthy

  nsfw-ensemble:
    build:
      context: .
      dockerfile: apps/nsfw-ensemble/Dockerfile
    restart: unless-stopped
    cpus: 2
    mem_limit: 2500m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3333/health', timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 6

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
